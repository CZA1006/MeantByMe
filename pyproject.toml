[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "meantbyme"
version = "0.1.0"
description = "Consent-first communication agent runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "lameenc>=1.7",
    "PyMySQL>=1.1,<2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "httpx2",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
