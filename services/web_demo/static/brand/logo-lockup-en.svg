<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96"
     role="img" aria-label="MeantByMe — Completed with AI. Meant by me.">
  <title>MeantByMe — Completed with AI. Meant by me.</title>
  <!-- Horizontal lockup. Mark height sets the cap height of the wordmark; the
       slogan sits on a second line at 44% of the wordmark size. Text is live
       rather than outlined, so this file needs the brand stack installed — for
       anywhere that cannot guarantee fonts, use the exported PNG. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(8 20.5) scale(1.15)">
    <g stroke="#1f807d" stroke-width="4.8">
      <path d="M21 9 H9.5 V21.5" />
      <path d="M27 39 H38.5 V26.5" />
    </g>
    <path d="M17.1 24.7 L22.4 30 L32.6 17.2" stroke="#695fc3" stroke-width="5.2" />
  </g>
  <text x="70" y="50" fill="#162323"
        font-family="Nunito, 'Avenir Next', system-ui, sans-serif"
        font-size="32" font-weight="800" letter-spacing="-0.4">MeantByMe</text>
  <text x="70" y="76" fill="#5d6968"
        font-family="Nunito, 'Avenir Next', system-ui, sans-serif"
        font-size="14" font-weight="600" letter-spacing="0.2">Completed with AI. Meant by me.</text>
</svg>
