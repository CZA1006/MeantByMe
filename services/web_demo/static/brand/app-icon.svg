<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MeantByMe">
  <title>MeantByMe</title>
  <!-- Home-screen tile. Warm paper ground rather than a saturated fill: this is
       a calm, light product, and a cream tile also reads distinctly on a home
       screen of dark app icons. Mark scaled to 62% with even clear space. -->
  <rect width="512" height="512" rx="114" fill="#faf6f3" />
  <rect x="4" y="4" width="504" height="504" rx="111" fill="none"
        stroke="#e0d8d0" stroke-width="8" />
  <!-- Scaled on the mark's ink box (≈34 of its 48 units), not the box itself,
       so the glyph optically fills ~58% of the tile the way icon grids expect. -->
  <g transform="translate(45 45) scale(8.8)" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#1f807d" stroke-width="4.8">
      <path d="M21 9 H9.5 V21.5" />
      <path d="M27 39 H38.5 V26.5" />
    </g>
    <path d="M17.1 24.7 L22.4 30 L32.6 17.2" stroke="#695fc3" stroke-width="5.2" />
  </g>
</svg>
